services:
  lexia:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      LEXIA_DATA_DIR: /data
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_ALLOWED_HOST: ollama
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:9b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      LEXIA_PRIMARY_PROVIDER: ${LEXIA_PRIMARY_PROVIDER:-ollama}
      LEXIA_API_TOKEN: ${LEXIA_API_TOKEN:?Defina LEXIA_API_TOKEN no arquivo .env}
      LEXIA_ALLOW_CLOUD: ${LEXIA_ALLOW_CLOUD:-false}
      LEXIA_FALLBACK_PROVIDER: ${LEXIA_FALLBACK_PROVIDER:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-5}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
    volumes:
      - lexia_data:/data
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
    restart: unless-stopped
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  ollama-pull:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:9b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      LEXIA_PRIMARY_PROVIDER: ${LEXIA_PRIMARY_PROVIDER:-ollama}
      LEXIA_FALLBACK_PROVIDER: ${LEXIA_FALLBACK_PROVIDER:-}
    entrypoint: ["/bin/sh", "-c", "if [ \"$$LEXIA_PRIMARY_PROVIDER\" != ollama ] && [ \"$$LEXIA_FALLBACK_PROVIDER\" != ollama ]; then echo 'Modelo Ollama não necessário para o provedor escolhido'; exit 0; fi; until ollama list >/dev/null 2>&1; do sleep 2; done; ollama pull \"$$OLLAMA_MODEL\"; ollama pull \"$$OLLAMA_EMBED_MODEL\""]
    depends_on:
      ollama:
        condition: service_started
    restart: "no"
volumes:
  lexia_data:
  ollama_data:
